name: Validar padrão Git

on:
  push:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validar-commit:
    name: Validar mensagem do commit
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validar último commit
        shell: bash
        run: |
          COMMIT_MESSAGE=$(git log -1 --pretty=%s)

          echo "Commit analisado:"
          echo "$COMMIT_MESSAGE"

          if [[ "$COMMIT_MESSAGE" =~ ^ROAD-[0-9]+:\ .+ ]]; then
            echo "✅ Commit segue o padrão."
          else
            echo "❌ Commit fora do padrão."
            echo ""
            echo "Formato esperado:"
            echo "ROAD-123: descrição curta"
            exit 1
          fi

  validar-pr:
    name: Validar título da Pull Request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Validar título da PR
        shell: bash
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"

          echo "Título da PR:"
          echo "$PR_TITLE"

          if [[ "$PR_TITLE" =~ ^ROAD-[0-9]+:\ .+ ]]; then
            echo "✅ Título da PR segue o padrão."
          else
            echo "❌ Título da PR fora do padrão."
            echo ""
            echo "Formato esperado:"
            echo "ROAD-123: descrição curta"
            exit 1
          fi