name: Ingestao Continua RoadVision

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  alimentar-supabase:
    name: Inserir contagens no Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install supabase python-dotenv pydantic-settings
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Executar pipeline de ingestao
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/feed_roadvision_ci.py
