name: Feed Continuo RoadVision (CI/CD)

on:
  schedule:
    # Executa a cada 5 minutos
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Executar em modo simulado (--dry-run)'
        required: false
        type: boolean
        default: false

jobs:
  feed-data:
    name: Alimentar Fluxo e Capturas da SP-055
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências do Pipeline
        run: |
          python -m pip install --upgrade pip
          pip install supabase pydantic python-dotenv tzdata

      - name: Executar Pipeline de Alimentação Contínua
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/feed_roadvision_ci.py --dry-run
          else
            python scripts/feed_roadvision_ci.py
          fi
