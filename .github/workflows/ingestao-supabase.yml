name: Ingestao Supabase RoadVision

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: ingestao-supabase
  cancel-in-progress: true

jobs:
  alimentar-supabase:
    name: Inserir contagens no Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias de ingestao
        run: |
          python -m pip install --upgrade pip
          pip install supabase python-dotenv pydantic pydantic-settings
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Validar Secrets do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Secret SUPABASE_URL nao configurado no repositorio."
            exit 1
          fi
          if [ -z "$SUPABASE_KEY" ] && [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Configure SUPABASE_KEY ou SUPABASE_SERVICE_ROLE_KEY nos Secrets."
            exit 1
          fi
          echo "Secrets validados com sucesso."

      - name: Executar pipeline de ingestao
        env:
          PYTHONPATH: .
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/feed_roadvision_ci.py
